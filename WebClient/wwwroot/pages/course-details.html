<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Курс — OnlineTesting</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <h1 id="course-page-title">Карточка курса</h1>
          <p class="page-subtitle">Теория, задания, тесты и участники курса.</p>
          <span class="service-note">Сервис: CourseService</span>
        </div>
        <div id="course-details-actions"></div>
      </div>

      <section class="course-hero" id="course-hero"></section>

      <section class="theory-section">
        <div class="section-head">
          <div>
            <h2 class="section-title">Теория</h2>
            <p class="muted small">Материалы курса для подготовки к тестам.</p>
          </div>
          <div id="course-theory-actions"></div>
        </div>
        <div class="theory-list" id="course-theory"></div>
      </section>

      <div class="two-column">
        <div>
          <h2 class="section-title">Задания курса</h2>
          <div class="module-list" id="course-modules"></div>
        </div>

        <aside>
          <h2 class="section-title">Тесты курса</h2>
          <div class="stack" id="course-tests"></div>

          <h2 class="section-title">Преподаватель</h2>
          <div class="card" id="course-teacher"></div>
        </aside>
      </div>
    </div>
  </main>

  <footer id="app-footer" class="app-footer"></footer>
  <script src="../js/layout.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/course-details.js"></script>
</body>
</html>
