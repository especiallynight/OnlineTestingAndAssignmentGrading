<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аналитика — OnlineTesting</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Сводная аналитика</h1>
          <p class="page-subtitle">Средние баллы, процент сдачи и активность по курсам.</p>
          <span class="service-note">Сервис: AnalyticsService</span>
        </div>
        <div id="analytics-actions"></div>
      </div>

      <div class="stats-grid" id="analytics-stats"></div>

      <div class="two-column">
        <section class="chart-card">
          <h2 class="chart-title">Средний балл по курсам (из 5)</h2>
          <div id="score-chart"></div>
          <div class="chart-legend">
            <span class="legend-item"><span class="legend-dot"></span>Средний балл</span>
          </div>
        </section>

        <section class="chart-card">
          <h2 class="chart-title">Процент сдачи</h2>
          <div id="pass-chart"></div>
          <div class="chart-legend">
            <span class="legend-item"><span class="legend-dot legend-dot-green"></span>Доля сдавших</span>
          </div>
        </section>
      </div>

      <h2 class="section-title">Детализация по курсам</h2>
      <div id="analytics-table"></div>
    </div>
  </main>

  <footer id="app-footer" class="app-footer"></footer>

  <script src="../js/data.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/analytics.js"></script>
</body>
</html>
