<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог курсов — OnlineTesting</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Каталог курсов</h1>
          <p class="page-subtitle">Курсы, доступные для изучения и прохождения тестов.</p>
          <span class="service-note">Сервис: CourseService</span>
        </div>
        <div id="courses-actions"></div>
      </div>

      <div class="toolbar">
        <div class="form-field">
          <label for="course-search">Поиск по названию</label>
          <input id="course-search" type="search" placeholder="Например, C#">
        </div>
        <div class="form-field">
          <label for="course-teacher-filter">Преподаватель</label>
          <select id="course-teacher-filter">
            <option value="all">Все преподаватели</option>
          </select>
        </div>
        <div class="form-field">
          <label>&nbsp;</label>
          <button class="btn btn-outline" type="button" id="courses-reset">Сбросить фильтры</button>
        </div>
      </div>

      <p class="muted small" id="courses-count"></p>
      <div class="cards-grid" id="courses-grid"></div>
    </div>
  </main>

  <footer id="app-footer" class="app-footer"></footer>
  <script src="../js/layout.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/courses.js"></script>
</body>
</html>
