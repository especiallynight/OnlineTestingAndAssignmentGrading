<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пользователи — OnlineTesting</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Пользователи и роли</h1>
          <p class="page-subtitle">Управление учётными записями студентов, преподавателей и администраторов.</p>
          <span class="service-note">Сервис: IdentityService</span>
        </div>
        <div id="users-actions"></div>
      </div>

      <div class="stats-grid" id="users-stats"></div>

      <div class="section-head">
        <h2 class="section-title">Добавить пользователя</h2>
      </div>

      <form class="form-card" id="user-form">
        <div class="form-grid">
          <div class="form-field">
            <label for="user-first-name">Имя</label>
            <input id="user-first-name" type="text" name="firstName" minlength="2" maxlength="40" placeholder="Иван" required>
          </div>
          <div class="form-field">
            <label for="user-last-name">Фамилия</label>
            <input id="user-last-name" type="text" name="lastName" minlength="2" maxlength="50" placeholder="Иванов" required>
          </div>
          <div class="form-field">
            <label for="user-email-input">Электронная почта</label>
            <input id="user-email-input" type="email" name="email" maxlength="100" placeholder="student@example.ru" required>
          </div>
          <div class="form-field">
            <label for="user-password-input">Пароль</label>
            <input id="user-password-input" type="password" name="password" minlength="6" maxlength="100" placeholder="Не менее 6 символов" required>
          </div>
          <div class="form-field">
            <label for="user-role-input">Роль</label>
            <select id="user-role-input" name="role">
              <option value="student">Студент</option>
              <option value="teacher">Преподаватель</option>
              <option value="admin">Администратор</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Создать пользователя</button>
          <span class="form-hint">Пользователь сможет войти с указанной почтой и паролем.</span>
        </div>
      </form>

      <div class="section-head">
        <h2 class="section-title">Заявки на роль преподавателя</h2>
      </div>
      <div id="applications-table"></div>

      <h2 class="section-title">Список пользователей</h2>
      <div id="users-table"></div>
    </div>
  </main>

  <footer id="app-footer" class="app-footer"></footer>

  <script src="../js/layout.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/admin-users.js"></script>
</body>
</html>
