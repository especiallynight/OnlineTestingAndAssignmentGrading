<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проверка работ — OnlineTesting</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Проверка работ</h1>
          <p class="page-subtitle">Попытки студентов, автоматические оценки и ручная проверка.</p>
          <span class="service-note">Сервис: GradingService</span>
        </div>
        <div id="grading-actions"></div>
      </div>

      <div class="stats-grid" id="grading-stats"></div>

      <div class="toolbar">
        <div class="form-field">
          <label for="grading-filter">Показать</label>
          <select id="grading-filter">
            <option value="all">Все работы</option>
            <option value="pending">Без оценки</option>
            <option value="graded">С оценкой</option>
          </select>
        </div>
      </div>

      <h2 class="section-title">Работы студентов</h2>
      <div id="grading-table"></div>

      <div class="notice">
        Оценки выставляются автоматически после завершения попытки.
        Кнопка «Открыть» показывает ответы студента; если оценки ещё нет,
        её можно выставить вручную.
      </div>
    </div>
  </main>

  <footer id="app-footer" class="app-footer"></footer>

  <script src="../js/layout.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/grading.js"></script>
</body>
</html>
