steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore OnlineTesting.slnx

      - name: Build solution
        run: dotnet build OnlineTesting.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test OnlineTesting.Tests/OnlineTesting.Tests.csproj --configuration Release