services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-service:
    build: { context: ., dockerfile: IdentityService/Dockerfile }
    ports: ["5005:8080"]
    environment:
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: IdentityService
      Jwt__Audience: OnlineTesting
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=DBIdentity;Username=postgres;Password=${DB_PASSWORD}"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  course-service:
    build: { context: ., dockerfile: CourseService/Dockerfile }
    ports: ["5001:8080"]
    environment:
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: IdentityService
      Jwt__Audience: OnlineTesting
      InternalApiKey: ${INTERNAL_API_KEY}
      Redis__ConnectionString: "redis:6379"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=DBCourse;Username=postgres;Password=${DB_PASSWORD}"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  exam-service:
    build: { context: ., dockerfile: ExamService/Dockerfile }
    ports: ["5002:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: IdentityService
      Jwt__Audience: OnlineTesting
      InternalApiKey: ${INTERNAL_API_KEY}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=DBExam;Username=postgres;Password=${DB_PASSWORD}"
      Services__CourseService: http://course-service:8080
      Services__CodeExecutionService: http://code-execution-service:8080
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      code-execution-service: { condition: service_started }
    restart: unless-stopped

  code-execution-service:
    build: { context: ., dockerfile: CodeExecutionService/Dockerfile }
    ports: ["5203:8080"]
    environment:
      InternalApiKey: ${INTERNAL_API_KEY}
      CodeRunner: process
    tmpfs:
      - /tmp:size=1g
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped

  grading-service:
    build: { context: ., dockerfile: GradingService/Dockerfile }
    ports: ["5003:8080"]
    environment:
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: IdentityService
      Jwt__Audience: OnlineTesting
      InternalApiKey: ${INTERNAL_API_KEY}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=DBGrade;Username=postgres;Password=${DB_PASSWORD}"
      Services__ExamService: http://exam-service:8080
      Services__CourseService: http://course-service:8080
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  analytics-service:
    build: { context: ., dockerfile: AnalyticsService/Dockerfile }
    ports: ["5004:8080"]
    environment:
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: IdentityService
      Jwt__Audience: OnlineTesting
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=DBAnal;Username=postgres;Password=${DB_PASSWORD}"
      Redis__ConnectionString: "redis:6379"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  api-gateway:
    build: { context: ., dockerfile: ApiGateway/Dockerfile }
    ports: ["5006:8080"]
    depends_on: [identity-service, course-service, exam-service, grading-service, analytics-service]
    restart: unless-stopped

  web-client:
    build: { context: ., dockerfile: WebClient/Dockerfile }
    ports: ["5000:8080"]
    environment:
      GatewayUrl: http://api-gateway:8080
    depends_on: [api-gateway]
    restart: unless-stopped

volumes:
  pgdata: