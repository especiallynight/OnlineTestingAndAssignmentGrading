
services:
  course-service:
    build:
      context: .
      dockerfile: CourseService/DockerFile
    ports:
      - "5001:8080"

  exam-service:
    build:
      context: .
      dockerfile: ExamService/DockerFile
    ports:
      - "5002:8080"

  grading-service:
    build:
      context: .
      dockerfile: GradingService/DockerFile
    ports:
      - "5003:8080"

  analytics-service:
    build:
      context: .
      dockerfile: AnalyticsService/DockerFile
    ports:
      - "5004:8080"

  identity-service:
    build:
      context: .
      dockerfile: IdentityService/Dockerfile
